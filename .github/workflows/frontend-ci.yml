name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check frontend
        run: pnpm --filter @caffeine/template-frontend typecheck
      - name: Build frontend
        run: pnpm --filter @caffeine/template-frontend build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js for Mops
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Mops
        uses: dfinity/setup-mops@v1
      - name: Install locked Motoko dependencies
        run: mops install --locked
      - name: Compile Motoko canisters
        run: mops build --locked
